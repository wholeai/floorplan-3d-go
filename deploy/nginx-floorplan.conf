# 户型装修设计 —— Nginx 反向代理示例：https://www.test.com/floorplan → 127.0.0.1:8801
#
# 后端这样启动（不要加 -base，前缀由 nginx 剥掉）：
#     ./floorplan3d -addr :8801 -db data/plan.db
#
# 把下面这段 server 贴进 nginx.conf 的 http { } 里面；已有站点的话，
# 只把两个 location 搬进你现有的 server 块即可。

server {
    listen 80;
    server_name www.test.com;

    # 1) 缺少结尾斜杠时先 301 补上。
    #    不加这条，浏览器会把 ./static/... 解析成 https://www.test.com/static/... 从而全 404。
    location = /floorplan {
        return 301 /floorplan/;
    }

    # 2) proxy_pass 结尾的 / 是关键：它会把 /floorplan 前缀剥掉再转发，
    #    于是 /floorplan/api/plan → 后端 /api/plan，/floorplan/static/x.js → /static/x.js。
    location /floorplan/ {
        proxy_pass http://127.0.0.1:8801/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PUT /api/plan、PUT /api/items 的请求体；后端上限 8MB，这里给 16MB 富余
        client_max_body_size 16m;

        # 方案与清单都是实时读写，别缓存接口
        proxy_buffering off;
    }

    # 3) 本地化的 three.js 是带版本号的死文件，可以放心给长缓存
    #    （前缀已被 proxy_pass 剥掉，所以这里匹配的是后端看到的路径）
    #    注意：这段要写在 /floorplan/ 之前才会优先生效，因为是更长的前缀匹配
    location /floorplan/static/ {
        proxy_pass http://127.0.0.1:8801/static/;
        proxy_set_header Host $host;
        proxy_buffering on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# 如果你想让 Go 自己带前缀（不用 nginx 剥），改成：
#     ./floorplan3d -addr :8801 -base /floorplan
#     location /floorplan/ { proxy_pass http://127.0.0.1:8801; }   # 注意结尾没有 /
# 两种方式二选一，不要混用。
