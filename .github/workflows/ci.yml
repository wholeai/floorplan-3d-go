name: CI

on:
  push:
    branches: [main]
    tags: ['v*']        # 打 tag 即自动出包 + 发 Release，不用本地 make release
  pull_request:
  workflow_dispatch:    # 也能在网页上手动跑一次

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: cross-compile all platforms
        run: make release VERSION=0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: floorplan3d-ci
          path: dist/*.zip
          retention-days: 7

  frontend:
    name: Frontend syntax & assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # e2e 用内置 WebSocket 走 CDP，Node 20 没有
      - run: node scripts/check-frontend.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: headless selftest (?selftest=1)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          go build -o /tmp/floorplan3d .
          /tmp/floorplan3d -addr 127.0.0.1:8788 -db /tmp/ci.db -no-open &
          sleep 2
          /usr/bin/google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=20000 \
            --dump-dom "http://127.0.0.1:8788/?selftest=1" > /tmp/dom.html
          grep -o 'SELFTEST [A-Z]*: [0-9]* passed, [0-9]* failed' /tmp/dom.html || true
          grep -q 'SELFTEST PASS' /tmp/dom.html
      - name: end-to-end clicks (CDP)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/e2e.mjs --url http://127.0.0.1:8788/
        # 服务在上一 step 已起在 8788，仍在跑（GHA 每个 step 共享容器）

  # 只有 tag 推送才会跑：产物自动挂到 GitHub Release 上，本地不需要 make release
  release:
    name: Package & publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, frontend]      # 测试不过不许发版
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build six platforms
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
      - name: publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true   # 自动生成变更列表（手动发版时才自己写 notes）
          fail_on_unmatched_files: true
